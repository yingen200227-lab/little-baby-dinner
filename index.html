:root{
  --primary:#e98eaa;
  --primary-dark:#d77d9e;
  --deep:#92546b;
  --bg-1:#fff9fc;
  --bg-2:#fff0f5;

  --blob-2:#ffeddf;
  --hero-1:#ffdce8;
  --hero-2:#f9c8d9;
  --hero-3:#ffe9df;
  --line:#f6dce6;
  --soft:#fff5f8;
  --tag-bg:#ffe5ed;
  --tag-text:#a86d82;
  --text:#694653;
  --subtext:#987785;
  --shadow:#d78ca522;
}
body.boy-theme{
  --primary:#5b9bd5;
  --primary-dark:#3f82c4;
  --deep:#2b547e;
  --bg-1:#f5faff;
  --bg-2:#e6f2ff;

  --line:#cde2f7;

  --subtext:#607d9b;
  --shadow:#4a89dc22;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 8% 5%,var(--blob-1) 0,transparent 30%),
    radial-gradient(circle at 95% 30%,var(--blob-2) 0,transparent 28%),
    linear-gradient(145deg,var(--bg-1),var(--bg-2));
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:20px 14px;
  transition:background .35s,color .35s;
}
.wrap{width:min(100%,600px)}

/* 頂部主題切換器 */
.theme-bar{
  display:flex;
  background:#ffffffcc;
  border:1px solid #fff;
  border-radius:99px;
  padding:5px;
  margin-bottom:14px;
  box-shadow:0 6px 20px var(--shadow);
}
.theme-btn{
  flex:1;
  border:0;
  background:transparent;
  padding:10px 12px;
  border-radius:99px;
  font-size:13px;
  font-weight:850;
  color:var(--subtext);
  cursor:pointer;
  transition:.25s;
}
.theme-btn.active{
  background:linear-gradient(100deg,var(--primary),var(--primary-dark));
  color:#fff;
  box-shadow:0 4px 12px var(--shadow);
}

.hero{
  text-align:center;
  padding:26px 18px 22px;
  border-radius:30px;
  background:linear-gradient(135deg,var(--hero-1),var(--hero-2) 58%,var(--hero-3));
  box-shadow:0 13px 32px var(--shadow);
  color:var(--deep);
  border:2px solid #fff;
  transition:background .35s,color .35s;
}
.hero .emoji{font-size:44px;letter-spacing:5px}
.hero h1{font-size:clamp(25px,6.8vw,34px);margin:8px 0 5px;font-weight:900;letter-spacing:1px}
.hero p{margin:6px 0 0;font-size:14px}

.live-status{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 13px;
  border-radius:99px;
  background:#ffffffba;
  font-size:12px;
  font-weight:700;
  color:var(--deep);
}

.panel{
  margin-top:15px;
  background:#ffffffe0;
  border:1px solid #fff;
  border-radius:23px;
  padding:18px;
  box-shadow:0 8px 25px var(--shadow);
}
.label{font-size:14px;font-weight:800;margin:0 0 11px;color:var(--deep)}

.loc-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.select-wrap{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.select-wrap span{font-size:11px;color:var(--subtext);font-weight:700;padding-left:4px}
select{
  width:100%;
  padding:11px 12px;
  border-radius:14px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-weight:750;
  outline:none;
  cursor:pointer;
}
select:focus{border-color:var(--primary)}
.weather-tip{
  margin-top:10px;
  font-size:12px;
  color:var(--tag-text);
  background:var(--soft);
  padding:8px 12px;
  border-radius:12px;
  line-height:1.5;
}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);
  background:#fff;
  border-radius:99px;
  padding:8px 13px;
  color:var(--text);
  font-size:13px;
  cursor:pointer;
  transition:.15s;
}
